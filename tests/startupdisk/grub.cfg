#
# DO NOT EDIT THIS FILE
#
if [ -s $prefix/grubenv ]; then
  load_env
fi
function load_video {
  if [ x$feature_all_video_module = xy ]; then
    insmod all_video
  fi
}
menuentry 'ZacOS 9 GNU/Linux' --class debian --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-simple-1234-abcd' {
	load_video
	insmod gzio
	linux	/boot/vmlinuz-6.12.111+deb13-amd64 root=UUID=1234-abcd ro quiet splash
	initrd	/boot/initrd.img-6.12.111+deb13-amd64
}
submenu 'Advanced options for ZacOS 9 GNU/Linux' $menuentry_id_option 'gnulinux-advanced-1234-abcd' {
	menuentry 'ZacOS 9 GNU/Linux, with Linux 6.12.111+deb13-amd64' --class debian --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-6.12.111+deb13-amd64-advanced-1234-abcd' {
		load_video
		linux	/boot/vmlinuz-6.12.111+deb13-amd64 root=UUID=1234-abcd ro quiet
	}
	menuentry 'ZacOS 9 GNU/Linux, with Linux 6.12.111+deb13-amd64 (recovery mode)' --class debian --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-6.12.111+deb13-amd64-recovery-1234-abcd' {
		linux	/boot/vmlinuz-6.12.111+deb13-amd64 root=UUID=1234-abcd ro single
	}
}
menuentry 'Windows Boot Manager (on /dev/nvme0n1p1)' --class windows --class os $menuentry_id_option 'osprober-efi-ABCD-1234' {
	insmod part_gpt
	chainloader /efi/Microsoft/Boot/bootmgfw.efi
}
menuentry 'Joe'\''s "Test" System' --class os $menuentry_id_option 'custom-joe' {
	true
}
menuentry 'UEFI Firmware Settings' $menuentry_id_option 'uefi-firmware' {
	fwsetup
}
