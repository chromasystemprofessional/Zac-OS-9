set default=0
# No menu and no text: a white screen while GRUB waits 3 seconds for Esc
# (or Shift), which shows the menu with the installer. Platinum 2026
# starts up silently: live-build's own config also plays a tune here.
set timeout_style=hidden
set timeout=3

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copied from the netinst image
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod gfxterm_background
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm
background_color 255,255,255
