set default=0
# No menu and no text: GRUB waits 3 seconds for Esc (or Shift), which shows
# the menu with the installer, on a white screen with the ZacOS 9 logo in
# the middle, as soon as it starts - the logo the boot splash (boot/plymouth)
# and zacos9-wm then keep showing in the same place. ZacOS 9 starts up
# silently: live-build's own config also plays a tune here.
set timeout_style=hidden
set timeout=3

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copied from the netinst image
if loadfont $font ; then
    # 800x600, so zacos9-boot.png (the logo placed in the middle of an
    # 800x600 picture: GRUB can only draw a background at the top left)
    # fits the screen exactly.
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod gfxterm_background
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm
background_color 255,255,255
background_image -m stretch /boot/grub/zacos9-boot.png
# Whatever GRUB prints on its own (loading messages, errors) is white on
# the white screen, so nothing shows over the logo. The menu keeps the
# colours of theme.cfg (menu_color_*), and its submenus read it again.
set color_normal=white/black
