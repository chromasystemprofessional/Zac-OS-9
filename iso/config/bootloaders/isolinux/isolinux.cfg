include menu.cfg
default vesamenu.c32
prompt 0
timeout 30
menu hidden
# Just the logo (splash.png, on white) for the 3 seconds Esc has to show the
# menu: no "Automatic boot in N seconds" under it, and no key hints.
menu color timeout_msg * #00ffffff #00000000 none
menu color timeout * #00ffffff #00000000 none
menu color tabmsg * #00ffffff #00000000 none
