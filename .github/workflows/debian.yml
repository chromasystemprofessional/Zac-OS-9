name: Debian build and tests

on:
  push:
    branches: [main, "agents/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_repo:
        description: "Publish the tested packages to the repo branch"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: debian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install bootstrap tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential debhelper devscripts fakeroot passwd ccache

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install declared build dependencies
        run: apt-get build-dep -y --no-install-recommends ./

      # Compiled objects from earlier runs: the package is always built in
      # /tmp/zacos9-debian/source, so a change recompiles only what it touches.
      # ccache replays a cached compile's warnings, so they're still counted.
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ccache
          key: ccache-debian-13-${{ github.sha }}
          restore-keys: ccache-debian-13-

      - name: Build and test the Debian package
        shell: bash
        run: |
          useradd --create-home builder
          mkdir -p /tmp/zacos9-debian/source
          git -c safe.directory="$GITHUB_WORKSPACE" archive HEAD | tar -x -C /tmp/zacos9-debian/source
          mkdir -p /tmp/ccache
          chown -R builder:builder /tmp/zacos9-debian /tmp/ccache
          cd /tmp/zacos9-debian/source
          echo "Building with $(nproc) jobs"
          status=0
          runuser -u builder -- env -u DEB_BUILD_OPTIONS -u DEB_BUILD_PROFILES \
            CCACHE_DIR=/tmp/ccache CCACHE_MAXSIZE=2G CC="ccache gcc" CXX="ccache g++" \
            xvfb-run -a dpkg-buildpackage -b -us -uc -j"$(nproc)" > /tmp/zacos9-package.log 2>&1 || status=$?
          tail -80 /tmp/zacos9-package.log
          runuser -u builder -- env CCACHE_DIR=/tmp/ccache ccache --show-stats
          exit "$status"

      - name: Count compiler warnings
        run: python3 tests/baseline/count_warnings.py /tmp/zacos9-package.log tests/baseline/warnings

      - name: Audit skipped tests
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          logs = list(Path("/tmp/zacos9-debian/source").glob("obj-*/meson-logs/testlog.json"))
          if len(logs) != 1:
              raise SystemExit(f"Expected one Meson test log, found {len(logs)}")
          results = [json.loads(line) for line in logs[0].read_text().splitlines()]
          if not results:
              raise SystemExit("Meson test log is empty")
          # Fcitx is not a build dependency: its smoke test skips without it.
          allowed = {"menudraw", "widgets", "decor", "screen-sharing-session", "afp-disconnect",
                     "input-method-fcitx"}
          skipped = {test["name"] for test in results if test["result"] == "SKIP"}
          unexpected = skipped - allowed
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Debian 13: {len(results)} tests recorded.\n\n")
              summary.write("Skipped tests: " + (", ".join(sorted(skipped)) or "none") + "\n")
          if unexpected:
              raise SystemExit("Unexpected skipped tests: " + ", ".join(sorted(unexpected)))
          PY

      - name: Collect packages and checksums
        run: |
          mkdir -p ci-artifacts
          cp /tmp/zacos9-debian/zacos9*.deb ci-artifacts/
          cd ci-artifacts
          for deb in *.deb; do
            case $deb in *-dbgsym_*.deb) continue ;; esac
            sha256sum "$deb"
          done > SHA256SUMS

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debian-13-logs
          path: |
            /tmp/zacos9-package.log
            /tmp/zacos9-debian/source/obj-*/meson-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload tested packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debian-13-amd64-packages
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -f "shell/update/whatsnew/$version.txt" ]; then
            cp "shell/update/whatsnew/$version.txt" release-notes.txt
          else
            echo "See the changelog." > release-notes.txt
          fi

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ci-artifacts/zacos9_*.deb
            ci-artifacts/zacos9-session_*.deb
            ci-artifacts/zacos9-greeter_*.deb
            ci-artifacts/SHA256SUMS
          tag_name: ${{ github.ref_name }}
          name: "ZacOS 9 ${{ github.ref_name }}"
          body_path: release-notes.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}

  repo:
    needs: package
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_repo)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg

      - name: Download the tested packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packages
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name debian-13-amd64-packages --dir packages

      - name: Import the signing key
        env:
          KEY: ${{ secrets.ZACOS9_REPO_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::ZACOS9_REPO_GPG_PRIVATE_KEY is not set"
            exit 1
          fi
          install -d -m 700 "$HOME/.gnupg"
          printf '%s' "$KEY" | tr -d '\n' | base64 -d | gpg --batch --import
          fingerprint=$(gpg --batch --with-colons --list-secret-keys |
            awk -F: '/^fpr:/ { print $10; exit }')
          if [ -z "$fingerprint" ]; then
            echo "::error::no signing key after import"
            exit 1
          fi
          echo "ZACOS9_REPO_KEY=$fingerprint" >> "$GITHUB_ENV"

      - name: Build the repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ZACOS9_REPO_GPG_PASSPHRASE: ${{ secrets.ZACOS9_REPO_GPG_PASSPHRASE }}
        run: |
          mkdir -p repo-out repo-packages
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" repo >/dev/null 2>&1; then
            git clone --depth 1 --branch repo "$remote" repo-old
            find repo-old -maxdepth 1 -type f \
              \( -name '*.deb' -o -name '*.source.tar.gz' \) \
              -exec cp -t repo-out {} +
          fi
          find packages -type f \
            \( -name '*.deb' -o -name '*.source.tar.gz' \) \
            -exec cp -t repo-packages {} +
          scripts/build-repo.sh --packages repo-packages --output repo-out

      - name: Publish the repository branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          repo_dir=$(mktemp -d)
          if git ls-remote --exit-code --heads "$remote" repo >/dev/null 2>&1; then
            git clone --depth 1 --branch repo "$remote" "$repo_dir"
          else
            git -C "$repo_dir" init -q
            git -C "$repo_dir" checkout -q --orphan repo
          fi
          git -C "$repo_dir" config user.name "github-actions[bot]"
          git -C "$repo_dir" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          find "$repo_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a repo-out/. "$repo_dir"/
          git -C "$repo_dir" add -A
          if git -C "$repo_dir" diff --cached --quiet; then
            echo "The repository branch is already current."
          else
            git -C "$repo_dir" commit -q -m "Repository: ${GITHUB_REF_NAME}"
            git -C "$repo_dir" push -q "$remote" HEAD:repo
          fi
          owner=${GITHUB_REPOSITORY%/*}
          name=${GITHUB_REPOSITORY#*/}
          {
            echo "## ZacOS 9 package repository"
            echo
            echo "Branch: https://github.com/${GITHUB_REPOSITORY}/tree/repo"
            echo "Pages:  https://${owner}.github.io/${name}/"
            echo "Key:    ${ZACOS9_REPO_KEY}"
          } >> "$GITHUB_STEP_SUMMARY"
