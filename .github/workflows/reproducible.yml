name: Reproducible package

on:
  push:
    tags: ["v*", "[0-9]*"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducible-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducible:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install bootstrap tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential debhelper devscripts fakeroot passwd

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install declared build dependencies
        run: apt-get build-dep -y --no-install-recommends ./

      # The package tests need an unprivileged user, like the package job.
      - name: Build twice and compare
        shell: bash
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          mkdir -p /tmp/zacos9-repro
          chown builder:builder /tmp/zacos9-repro
          runuser -u builder -- env ZACOS9_BUILD_TMPDIR=/tmp/zacos9-repro \
            scripts/check-reproducible.sh

      - name: Upload the build logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reproducible-logs
          path: |
            /tmp/zacos9-repro/zacos9-repro.*/one.log
            /tmp/zacos9-repro/zacos9-repro.*/two.log
            /tmp/zacos9-repro/zacos9-repro.*/hashes.diff
          if-no-files-found: warn
          retention-days: 14
