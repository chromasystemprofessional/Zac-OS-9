# macipgw comes with atalkd (a Recommends) but needs its own IP network, which
# /etc/netatalk/macipgw.conf leaves commented out. Unconfigured, it exits 64
# and the boot shows a failed service. Skip it until a network is set.
[Service]
ExecCondition=/bin/sh -c 'grep -Eq "^[[:space:]]*network[[:space:]]*=" /etc/netatalk/macipgw.conf'
