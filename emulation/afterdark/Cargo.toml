[workspace]
resolver = "3"
members = [
    "crates/ad-resource",
    "crates/ad-m68k",
    "crates/ad-memory",
    "crates/ad-toolbox",
    "crates/ad-host-v2",
    "crates/ad-runtime",
    "crates/ad-saver",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The Rust code only. The vendored C under `crates/ad-m68k/vendor/` carries its
# own notices, and the modules and fonts are Berkeley Systems' and Apple's,
# neither of which ships here — see LICENSE.
license = "MIT"
repository = "https://github.com/panth-net/after-dark-repository-rust"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
