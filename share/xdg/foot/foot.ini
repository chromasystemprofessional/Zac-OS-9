# Terminal (foot) in a ZacOS 9 session: zacos9-session puts this folder
# first in XDG_CONFIG_DIRS; ~/.config/foot/foot.ini still overrides it.
# zacos9-wm hands ⌘ (Mod4) to foot as itself, not as Ctrl, so ⌘C copies
# and ⌘V pastes while Ctrl+C still interrupts. foot's own keys stay too.

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy Mod4+c
clipboard-paste=Control+Shift+v XF86Paste Mod4+v
