<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The fonts programs see in a ZacOS session (zacos9-session sets
  FONTCONFIG_FILE to this file): the free fonts that stand in for Mac OS 9's,
  ZacOS 9's own two (assets/fonts/*.ttf), which the Fonts folder shows, and
  the user's own fonts. Every other font
  installed is hidden.

  Every font is rejected (an empty pattern matches all of them), then these
  are accepted back by family; the user's own are accepted by file in
  zacos9/fonts-own.conf, which the Sniffer keeps up to date. (Rejecting
  folders instead can't be undone for single fonts: a rejected folder isn't
  even read.) The families must be fontMacFamilies() in
  shell/files/fonts.cpp; test fonts-for-programs checks.
-->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <pattern/>
    </rejectfont>
    <acceptfont>
      <pattern><patelt name="family"><string>Nimbus Sans</string></patelt></pattern>
      <pattern><patelt name="family"><string>Nimbus Roman</string></patelt></pattern>
      <pattern><patelt name="family"><string>Nimbus Mono PS</string></patelt></pattern>
      <pattern><patelt name="family"><string>P052</string></patelt></pattern>
      <pattern><patelt name="family"><string>C059</string></patelt></pattern>
      <pattern><patelt name="family"><string>Standard Symbols PS</string></patelt></pattern>
      <pattern><patelt name="family"><string>Z003</string></patelt></pattern>
      <pattern><patelt name="family"><string>Linux Libertine O</string></patelt></pattern>
      <pattern><patelt name="family"><string>DejaVu Sans</string></patelt></pattern>
      <pattern><patelt name="family"><string>DejaVu Sans Mono</string></patelt></pattern>
      <pattern><patelt name="family"><string>Liberation Sans</string></patelt></pattern>
      <pattern><patelt name="family"><string>Liberation Serif</string></patelt></pattern>
      <pattern><patelt name="family"><string>Liberation Mono</string></patelt></pattern>
      <pattern><patelt name="family"><string>Comic Neue</string></patelt></pattern>
      <pattern><patelt name="family"><string>ZacOS 9 System</string></patelt></pattern>
      <pattern><patelt name="family"><string>ZacOS 9 Views</string></patelt></pattern>
    </acceptfont>
  </selectfont>
  <!-- ZacOS 9's own fonts are pixel fonts (each pixel a square of the
       outline): unhinted, their edges fall on pixel boundaries at their
       sizes (12 and 9 px) and they render exactly as the bitmaps do. -->
  <match target="font">
    <test name="family" compare="contains"><string>ZacOS 9</string></test>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <include ignore_missing="yes" prefix="xdg">zacos9/fonts-own.conf</include>
  <!-- Debian prefers serif fonts this hides: Times's stand-in instead. -->
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Nimbus Roman</family><family>Liberation Serif</family></prefer>
  </alias>
</fontconfig>
